<body><div class="shell"><aside class="rail"><div class="brand"><span class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 13h16a8 8 0 0 1-16 0Z M3 13h18 M8 4v4 M12 3v5 M16 4v4"/></svg></span>家庭点菜</div><h1 class="tagline">一起决定，<br>好好吃饭。</h1><p>一个家庭，一份公共菜谱。<br>从今晚想吃什么，到饭后的一句好评。</p><div class="railnav"><button data-action="home"><span>01</span>今日菜单</button><button data-action="catalog"><span>02</span>家庭菜品</button><button data-action="history"><span>03</span>过往记录</button><button data-action="profile"><span>04</span>我的与公共管理</button></div><div class="scene-box"><label for="scene">交互场景</label><select id="scene"><option value="normal">标准演示数据</option><option value="setup">首次连接与初始化</option><option value="empty">今日空菜单</option><option value="offline">离线 · 保留当前内容</option><option value="loading">加载状态</option><option value="unknown">下次提交 · 响应未知</option><option value="conflict">下次认领 · 已被家人认领</option><option value="version">编辑菜谱 · 版本冲突</option><option value="epoch">家庭数据代次变化</option></select><button class="secondary" data-action="applyScene">进入所选场景</button></div><div class="rail-foot">浏览器本机交互演示 · 设计 1.0<br>无需联网，无真实后端操作<br>数据可在场景中重置。</div></aside><section class="phone" aria-label="家庭点菜移动端原型"><div class="statusbar"><span>9:41</span><span class="capsule">•••　│　◉</span></div><div class="mobile-tools"><button data-action="showScenes">演示场景 · 本机数据</button></div><main id="screen" class="screen" tabindex="-1"></main><nav id="nav" class="nav" aria-label="主导航"></nav><div id="toast" class="toast" role="status" aria-live="polite"></div></section></div><dialog id="modal" aria-modal="true"></dialog><script>/* 浏览器原型领域模型。使用本机演示数据，不替代服务端事务或权限校验。 */

 if(a==='repeatAdd'){if(pending()){go('draft');toast('请先确认上一次提交结果');return;}if(draft().length+ui.repeat.length>50){toast('一次最多 50 条，请减少所选');return;}for(const rid of ui.repeat){const i=menuItem(rid);if(!D.available(state,i.dishId)){toast('部分菜品不可点');return;}}for(const rid of ui.repeat){const i=menuItem(rid);draft().push({localId:'draft-'+Date.now()+'-'+rid,dishId:i.dishId,note:i.note,sourceItem:rid});}save();rawGo('draft');return;}
 if(a==='ballot'){const v=state.votes.find(v=>v.id===id),did=b.dataset.dish,current=v?.ballots[ui.member]||[],dishIds=current.includes(did)?current.filter(x=>x!==did):[...current,did];if(run('ballot',{id,dishIds})){render();toast(dishIds.includes(did)?'已选择，可继续多选':'已取消这道菜');}return;}
 if(a==='finishVote'){const v=state.votes.find(v=>v.id===id),top=D.leaders(v);if(top.length>1){modal('票数并列，选定一道菜',`<p>${Object.keys(v.ballots).length?'请从最高票的候选中选择。':'目前 0 票，所有候选并列。'}由发起人选定这一次的结果。</p>`,top.map(did=>btn(esc(v.candidates.find(c=>c.dishId===did).name),'selectWinner','primary',`data-id="${id}" data-dish="${did}"`)));}else confirmAction('结束本轮投票？','结束后不能继续投票或改票，结果会保留。',()=>{if(run('finishVote',{id})){render();toast('投票已结束');}},'结束投票');return;}

 if(a==='cancelVote'){confirmAction('取消本轮投票？','不产生获胜菜，取消结果仍然可以查看。',()=>{if(run('cancelVote',{id})){render();toast('本轮投票已取消');}},'确认取消',true);return;}
 if(a==='addWinner'){if(run('addWinner',{id,date:state.today})){render();toast('已加入今日菜单，每轮仅一次');}return;}
 if(a==='startVote'){const r=run('startVote',ui.voteForm);if(r){ui.dirty=false;rawGo('vote',r.id);toast('投票已发起');}return;}
 if(a==='toggleDish'){const d=dish(id),rev=d.revision;confirmAction(d.active?'下架这道菜？':'上架这道菜？',d.active?'下架后不能新点；菜谱、已点事项和历史仍保留。':'上架后家庭成员可以选择这道菜。',()=>{if(run('toggleDish',{id,revision:rev})){render();toast(d.active?'已下架':'已上架');}},d.active?'确认下架':'确认上架');return;}
 if(a==='addStep'){if(ui.edit.steps.length>=50){toast('最多 50 个步骤');return;}ui.edit.steps.push('');ui.dirty=true;save();render();return;}if(a==='removeStep'){ui.edit.steps.splice(Number(b.dataset.index),1);ui.dirty=true;save();render();return;}if(a==='stepUp'){const i=Number(b.dataset.index);[ui.edit.steps[i-1],ui.edit.steps[i]]=[ui.edit.steps[i],ui.edit.steps[i-1]];ui.dirty=true;save();render();return;}

 if(a==='dependencyItem'||a==='dependencyVote'){closeModal();rawGo(a==='dependencyItem'?'item':'vote',id);return;}
 if(a==='editFamily'){modal('家庭名称',`<label class="field"><span>名称</span><input id="familyName" maxlength="30" value="${esc(state.family?.name)}"></label>`,[btn('保存','saveFamily','primary')]);return;}if(a==='saveFamily'){if(run('familyName',{name:$('#familyName').value})){closeModal();render();toast('家庭名称已保存');}return;}
 if(a==='testConnection'){const val=$('#serviceAddress').value.trim();try{const url=new URL(val);if(!['http:','https:'].includes(url.protocol)||url.username||url.password||url.search||url.hash)throw new Error();}catch(_){toast('请输入有效的 http:// 或 https:// 服务地址');return;}if(ui.offline){toast('连接不可达（离线演示），地址已保留');ui.address=val;save();return;}ui.address=val;save();confirmAction('连接成功（模拟）',state.family?`识别到“${state.family.name}”。本操作没有发送真实网络请求。`:'服务尚未初始化，请创建家庭。本操作没有发送真实网络请求。',()=>{ui.member=null;ui.stack=[];rawGo(state.family?'identity':'setup',null,false);},state.family?'选择成员':'创建家庭');return;}
 if(a==='setupSave'){const name=$('#setupName').value.trim(),names=$('#setupMembers').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!name||[...name].length>30||!names.length||names.length>20||names.some(n=>[...n].length>20)||new Set(names.map(D.norm)).size!==names.length){toast('请填写家庭名与 1—20 位不同名称的成员');return;}if(state.family){toast('家庭已初始化');return;}state.family={name,timezone:'Asia/Shanghai'};state.members=names.map((name,i)=>({id:'member-init-'+i,name,active:true}));ui.stack=[];rawGo('identity',null,false);return;}
 if(a==='showScenes'){scenesDialog();return;}if(a==='applyScene'){requestScene($('#scene').value);return;}if(a==='chooseScene'){requestScene(b.dataset.scene);return;}if(a==='online'){ui.offline=false;save();render();toast('模拟连接已恢复，未自动提交任何内容');return;}if(a==='endLoading'){ui.loading=false;save();render();return;}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){ui.search=t.value;const pos=t.selectionStart;save();render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos);return;}if(t.dataset.draft){if(!pending()){const x=draft().find(x=>x.localId===t.dataset.draft);if(x)x.note=t.value;save();}return;}if(t.dataset.edit){ui.edit[t.dataset.edit]=t.value;ui.dirty=true;save();return;}if(t.dataset.step!==undefined){ui.edit.steps[Number(t.dataset.step)]=t.value;ui.dirty=true;save();return;}if(t.id==='reviewComment'){ui.review.comment=t.value;ui.dirty=true;save();return;}if(t.id==='voteTitle'){ui.voteForm.title=t.value;ui.dirty=true;save();return;}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.repeat){ui.repeat=t.checked?[...ui.repeat,t.dataset.repeat]:ui.repeat.filter(id=>id!==t.dataset.repeat);save();render();return;}if(t.dataset.voteChoice){ui.voteForm.dishIds=t.checked?[...ui.voteForm.dishIds,t.dataset.voteChoice]:ui.voteForm.dishIds.filter(id=>id!==t.dataset.voteChoice);ui.dirty=true;save();render();return;}if(t.id==='coverFile'){const f=t.files?.[0];if(!f)return;if(f.size>52428800||!f.size){toast(f.size?'文件超过 50 MiB，请选择较小的原文件':'空文件不能作为图片');t.value='';return;}if(fileURL)URL.revokeObjectURL(fileURL);const preview=['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)&&f.size<=2097152;ui.edit.cover={name:f.name,size:f.size,type:f.type||'未知声明类型',preview};fileURL=preview?URL.createObjectURL(f):null;ui.dirty=true;save();render();toast('已选本机文件；实际内容识别与原图上传由正式服务执行');}});
